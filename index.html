<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pharmaceutics Master 💊</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- عناصر التحكم العلوية: زر كتم الصوت واختيار وقت العد -->
    <div class="top-controls-bar">
        <button id="sound-toggle-btn" class="icon-control-btn" onclick="toggleSound()" title="تشغيل/كتم الصوت">
            🔊
        </button>
    </div>

    <div id="app-container">
        <!-- الشاشة الرئيسية -->
        <div id="home-screen" class="screen active">
            <div class="header-container">
                <h1 class="app-title">Pharmaceutics I</h1>
                <p class="app-subtitle">اختر المحاضرة ونوع الاختبار للبدء</p>
            </div>
            <div id="lectures-grid" class="lectures-grid"></div>
        </div>

        <!-- شاشة الاختبار والحل -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span class="close-btn" onclick="goHome()" title="خروج">✕</span>
                <div class="progress-bar-bg">
                    <div id="bar" class="progress-bar-fill"></div>
                </div>
                <div id="counter" class="counter-text" style="font-weight: 800; font-size: 14px;">0/0</div>
            </div>

            <div id="lecture-tag" class="lecture-tag">المحاضرة الأولى</div>

            <!-- حاوية المراجعة السريعة (آلة كاتبة + عد تنازلي + تخطي) -->
            <div id="quick-review-box" class="quick-review-container">
                <div class="typewriter-card info-en-card" dir="ltr">
                    <div class="typewriter-header" dir="ltr">💡 Concept:</div>
                    <div id="typewriter-text-en" class="typewriter-text en"></div>
                </div>
                <div class="typewriter-card info-ar-card" dir="rtl">
                    <div class="typewriter-header" dir="rtl">💡 المفهوم بالعربية:</div>
                    <div id="typewriter-text-ar" class="typewriter-text"></div>
                </div>

                <!-- شريط خيارات الوقت وزر التخطي -->
                <div class="review-actions-bar">
                    <div class="time-select-wrap">
                        <span>وقت الانتظار:</span>
                        <select id="timer-duration-select" class="time-select-dropdown" onchange="changeTimerDuration(this.value)">
                            <option value="3">3 ثوانٍ</option>
                            <option value="5" selected>5 ثوانٍ</option>
                            <option value="10">10 ثوانٍ</option>
                            <option value="15">15 ثانية</option>
                        </select>
                    </div>

                    <button class="skip-review-btn" onclick="skipToQuestion()">
                        تخطي للسؤال ⏩
                    </button>
                </div>

                <div id="countdown-box" class="countdown-box" dir="rtl">
                    ⏳ سيظهر السؤال خلال: <span id="countdown-num" class="countdown-num">5</span> ثوانٍ
                </div>
            </div>

            <!-- بطاقة السؤال والخيارات -->
            <div id="question-card" class="question-box" style="display: none;">
                <div id="q-txt" class="question-text"></div>
            </div>
            <div class="options-container" id="opt-box" style="display: none;"></div>

            <!-- صندوق الشرح التوضيحي -->
            <div class="explanation-box" id="note-box">
                <div class="explanation-title" id="note-title">📝 ملاحظة توضيحية:</div>
                <div id="note-content" class="note-content"></div>
            </div>

            <!-- شريط التنقل السفلي -->
            <div class="footer">
                <button id="prev-btn" class="nav-btn prev" onclick="goPrev()">السابق</button>
                <button id="next-btn" class="nav-btn next" onclick="goNext()">التالي</button>
            </div>
        </div>

        <!-- زر الترجمة العائم -->
        <button id="floating-translate-btn" class="floating-translate-btn" onclick="toggleTranslation()">
            <span id="translate-btn-label">English</span>
        </button>

        <!-- شاشة التهنئة -->
        <div id="win-overlay" class="overlay">
            <div class="dialog">
                <h2 style="color: var(--primary-blue); font-size: 24px; margin: 0 0 10px 0;">عمل رائع! 🧬</h2>
                <p style="font-size: 15px; font-weight: bold; color: var(--text-muted); margin-bottom: 20px;">
                    لقد أتممت جميع الأسئلة بنجاح.
                </p>
                <button class="btn-main" onclick="goHome()">العودة للقائمة الرئيسية</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
